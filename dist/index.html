canvas {
  display: block;
}

#hint {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: #b8e6c8;
  font: 13px system-ui, sans-serif;
  opacity: 0.8;
  pointer-events: none;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

<body>
  <div id="hint">Drag to rotate · Scroll to zoom</div>

  <!-- Three.js r149 as a classic script, so this works by double-clicking index.html -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script>
// If the Three.js CDN script didn't load (offline, blocked), say so instead of staying blank
if (typeof THREE === "undefined") {
  document.getElementById("hint").textContent =
    "Three.js failed to load. Check your internet connection and reload.";
  throw new Error("Three.js not loaded");
}

// Scene setup (transparent canvas so the CSS background image shows through)
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// Simple orbit controls (drag to rotate, scroll to zoom, slow auto-rotate when idle)
const orbit = {
  radius: camera.position.length(),
  theta: 0,
  phi: Math.acos(camera.position.y / camera.position.length()),
  dragging: false,
  lastX: 0,
  lastY: 0,
};

function updateCamera() {
  const { radius, theta, phi } = orbit;
  camera.position.set(
    radius * Math.sin(phi) * Math.sin(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(0, 0, 0);
}

const canvas = renderer.domElement;
canvas.style.touchAction = "none";

canvas.addEventListener("pointerdown", (e) => {
  orbit.dragging = true;
  orbit.lastX = e.clientX;
  orbit.lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!orbit.dragging) return;
  orbit.theta -= (e.clientX - orbit.lastX) * 0.005;
  orbit.phi -= (e.clientY - orbit.lastY) * 0.005;
  orbit.phi = Math.min(Math.max(orbit.phi, 0.1), Math.PI - 0.1);
  orbit.lastX = e.clientX;
  orbit.lastY = e.clientY;
});
const stopDrag = () => { orbit.dragging = false; };
canvas.addEventListener("pointerup", stopDrag);
canvas.addEventListener("pointercancel", stopDrag);
canvas.addEventListener(
  "wheel",
  (e) => {
    e.preventDefault();
    orbit.radius = Math.min(Math.max(orbit.radius * (1 + e.deltaY * 0.001), 4), 25);
  },
  { passive: false }
);

// Lights
scene.add(new THREE.AmbientLight(0x305040, 0.8));
const key = new THREE.PointLight(0x55ff99, 1.5, 40);
key.position.set(5, 5, 5);
scene.add(key);
const fill = new THREE.PointLight(0x9dff3b, 1.2, 40);
fill.position.set(-6, -3, 4);
scene.add(fill);

// Three green orbs
const orbs = [];
const orbGroup = new THREE.Group();
scene.add(orbGroup);
const orbColors = [0x2bff7a, 0x1fd45f, 0x7dff3a];

for (let i = 0; i < 3; i++) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.75, 64, 64),
    new THREE.MeshStandardMaterial({
      color: orbColors[i],
      metalness: 0.2,
      roughness: 0.2,
      emissive: orbColors[i],
      emissiveIntensity: 0.9,
    })
  );

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 32, 32),
    new THREE.MeshBasicMaterial({
      color: orbColors[i],
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );

  const light = new THREE.PointLight(orbColors[i], 1.5, 14);

  const orb = new THREE.Group();
  orb.add(mesh, halo, light);
  orbGroup.add(orb);
  orbs.push(orb);
}

// Animation loop
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();

  orbs.forEach((orb, i) => {
    const a = t * 0.9 + (i * Math.PI * 2) / 3;
    const r = 2.2 + Math.sin(t * 0.6 + i) * 0.3;
    orb.position.set(Math.cos(a) * r, Math.sin(a * 1.3 + i) * 0.9, Math.sin(a) * r);
    orb.scale.setScalar(1 + Math.sin(t * 2 + i * 2) * 0.08);
  });
  orbGroup.rotation.y = t * 0.2;
  orbGroup.rotation.x = Math.sin(t * 0.3) * 0.3;

  key.position.x = Math.cos(t * 0.7) * 6;
  key.position.z = Math.sin(t * 0.7) * 6;

  if (!orbit.dragging) orbit.theta += 0.003;
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// Resize handling
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
